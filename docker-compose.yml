# Self-hosting stack: the app (built from Dockerfile) + PostgreSQL.
# Copy .env.example to .env, set the values, then:  docker compose up -d --build
# Data persists in the named volumes (pgdata, uploads) across restarts/rebuilds.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-employee_movement_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employee_movement_ai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-employee_movement_ai}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      APP_URL: ${APP_URL:-http://localhost:4000}
      CORS_ORIGIN: ${APP_URL:-http://localhost:4000}
      PUBLIC_UPLOADS_BASE_URL: /uploads
      # false for plain HTTP (localhost / LAN IP); true only when served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Set to true for the FIRST boot on a fresh database to create the admin user +
      # default signatories/template, then set back to false.
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@itmg.co.id}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - uploads:/app/backend/uploads

volumes:
  pgdata:
  uploads:
